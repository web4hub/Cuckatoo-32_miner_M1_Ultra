# =============================================================================
# miner.conf  --  configuration for the standalone Grin Cuckatoo-32 miner
# (mine34_live, Apple M1 Ultra / Metal).
#
# Format: KEY=VALUE, one per line, shell-sourceable. No spaces around '='.
# Lines starting with '#' are comments. Everything has a safe default, so an
# empty/edited file still mines against a local node.
#
# Edit, then:   ./start.sh            (headless, detached)
#               ./start.sh -f         (foreground / live console)
#               ./stop.sh             (stop the headless miner)
# =============================================================================


# --- Stratum / node connection -----------------------------------------------
# A reachable grin 5.4.0 MAINNET node must be serving the stratum port below.
# These map 1:1 to the miner's env vars (M1_STRATUM_*). All have in-binary
# defaults; the values here just make them explicit and easy to change.

# Hostname or IP of the grin node's stratum server.
M1_STRATUM_HOST=https://grin.2miners.com/api
# Stratum TCP port (grin default mainnet stratum is 3416).
M1_STRATUM_PORT=4040

# Login / worker name reported to the pool/node.
M1_STRATUM_LOGIN=web_4

# Password (most grin nodes ignore it; "x" is the conventional placeholder).
M1_STRATUM_PASSWORD=x


# --- Mining parameters (positional args to the binary) -----------------------

# Edge bits. C32 is real Cuckatoo mainnet size. DO NOT change to a toy size
# (19/27): this miner is correctness-validated at 32 only.
EDGE_BITS=32

# Trimming half-rounds per graph. 160 is the tuned/best value; lower trims less
# (more false cycles, wasted GPU), higher costs time for no extra correctness.
ROUNDS=160

# Max graphs to mine, then exit. 0 = run forever (recommended). The fast warm
# loop lives INSIDE the binary (seed once, ~1.9s/graph warm vs ~6.5s cold);
# never cap this to force per-graph relaunch -- that throws away the warm speedup.
MAXGRAPHS=0


# --- Steerer (UNVALIDATED -- keep OFF) ---------------------------------------
# The steerer is an experimental parallel CPU pre-filter that predicts and skips
# "cycle-free" graphs. It is NOT validated on real keys and can skip real
# solutions. LEAVE BLANK to keep it OFF (the binary treats the var as ON if it
# is set to ANYTHING, including empty -- the launcher only exports it when this
# is non-empty). To experiment: set a numeric skip threshold, e.g. M1_STEER=50.
M1_STEER=

# Optional steerer state file (per-difficulty threshold/weights). Only consulted
# when M1_STEER is enabled. Leave blank when the steerer is OFF.
M1_STEER_STATE=


# --- Telemetry (optional, OFF by default) ------------------------------------
# JSONL telemetry of per-graph stats. Leave the path BLANK to disable telemetry
# entirely (default). Set an absolute path to enable; the binary self-rotates
# the file using the two knobs below, so logs never grow unbounded.
M1_TELEMETRY_PATH=

# Rotate the telemetry file once it reaches this many MB (only used when a path
# is set). 256 is the binary default.
M1_TELEMETRY_MAX_MB=256

# How many rotated telemetry files to keep (.1 .. .N). 4 is the binary default.
M1_TELEMETRY_KEEP_FILES=4


# --- Launcher / process supervision (consumed by start.sh, not the binary) ---

# Where to write the timestamped stdout/stderr log. Default: ./logs under the
# miner directory. Each launch creates miner-YYYYmmdd-HHMMSS.log here.
LOG_DIR=

# Auto-restart the miner if it exits (e.g. node was down at launch -> the binary
# exits immediately on stratum-login failure; restart lets it recover when the
# node returns). 1 = supervise & restart, 0 = run once and stop on exit.
AUTO_RESTART=1

# Seconds to wait between restarts (backoff so a down node is not hammered).
RESTART_DELAY=10

# Force line-buffered logs via a pty (macOS `script`). 1 = real-time logs you
# can `tail -f` immediately (recommended). 0 = raw block-buffered stdout (log
# may lag minutes behind and lose the last block on stop).
PTY_LOG=1
